<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPINOIA HORIZON — The Sanctum. Conjure Merlin.</title>
<link rel="canonical" href="https://epinoiahorizon.com/">
<meta name="description" content="Step into the Sanctum — an explorable 3D shrine for Merlin Agent: the self-improving AI harness that lives in your terminal. One command. Conjure it.">
<meta property="og:title" content="EPINOIA HORIZON — The Sanctum">
<meta property="og:description" content="An explorable 3D sanctum for Merlin Agent. One command installs an AI that lives in your terminal.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#00141b; --ink:#eee8d5; --dim:#93a1a1; --faint:#586e75;
  --cyan:#2aa198; --magenta:#d33682; --violet:#6c71c4; --yellow:#b58900;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',monospace;overflow:hidden}
::selection{background:var(--magenta);color:#00141b}
#stage{position:fixed;inset:0;display:block;cursor:grab}
#stage:active{cursor:grabbing}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:18px 26px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.22em;font-size:15px;color:var(--ink);text-decoration:none}
.brand i{font-style:normal;color:var(--cyan)}
.toggles{display:flex;gap:10px}
.tg{font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:var(--dim);
  background:rgba(0,20,27,.55);border:1px solid rgba(147,161,161,.25);border-radius:999px;
  padding:9px 16px;cursor:pointer;backdrop-filter:blur(8px);transition:all .2s}
.tg b{color:var(--cyan);font-weight:700}
.tg.off b{color:var(--faint)}
.tg:hover{border-color:var(--cyan)}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;z-index:100;background:radial-gradient(1200px 700px at 50% 42%,#02222c 0%,#00141b 62%,#000d12 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  transition:opacity 1.1s ease,visibility 1.1s}
#gate.away{opacity:0;visibility:hidden;pointer-events:none}
#gate .mark{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(40px,9vw,96px);letter-spacing:.14em;color:var(--ink);
  text-shadow:0 0 60px rgba(42,161,152,.25)}
#gate .sub{margin-top:14px;font-size:clamp(13px,2.4vw,20px);font-weight:700;letter-spacing:.34em;
  background:linear-gradient(90deg,var(--cyan),var(--violet),var(--magenta));
  -webkit-background-clip:text;background-clip:text;color:transparent}
#gate .rule{width:min(320px,60vw);height:1px;margin:34px 0 44px;
  background:linear-gradient(90deg,transparent,var(--cyan),var(--magenta),transparent)}
.coin{position:relative;font:700 13px/1 'JetBrains Mono',monospace;letter-spacing:.3em;color:var(--yellow);
  background:rgba(2,26,34,.6);border:1px solid rgba(181,137,0,.55);border-radius:999px;
  padding:19px 44px;cursor:pointer;transition:all .25s;animation:breathe 2.6s ease-in-out infinite}
.coin:hover{color:#00212a;background:var(--yellow);box-shadow:0 0 44px rgba(181,137,0,.45);animation:none}
@keyframes breathe{0%,100%{box-shadow:0 0 18px rgba(181,137,0,.18)}50%{box-shadow:0 0 34px rgba(181,137,0,.4)}}
.coin::before{content:"";position:absolute;inset:-7px;border:1px solid rgba(181,137,0,.35);border-radius:999px;animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.94);opacity:0}45%{opacity:.9}100%{transform:scale(1.12);opacity:0}}
#gate .hint{margin-top:22px;font-size:11px;letter-spacing:.26em;color:var(--faint)}
#gate .caret{display:inline-block;width:9px;height:16px;background:var(--cyan);vertical-align:-2px;margin-left:6px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#gate .foot{position:absolute;bottom:26px;font-size:11px;letter-spacing:.2em;color:var(--faint)}

/* ---------- HUD ---------- */
.hud-art{position:fixed;left:26px;bottom:24px;z-index:40;font-size:11px;letter-spacing:.24em;color:var(--faint)}
.hud-art b{color:var(--dim);font-weight:500}
.navarrow{position:fixed;right:22px;bottom:22px;z-index:40;display:flex;flex-direction:column;gap:10px}
.navarrow button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(147,161,161,.3);
  background:rgba(0,20,27,.55);color:var(--dim);font-size:16px;cursor:pointer;backdrop-filter:blur(8px);transition:all .2s}
.navarrow button:hover{border-color:var(--cyan);color:var(--cyan)}

/* ---------- info panel ---------- */
#panel{position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(480px,94vw);
  display:flex;flex-direction:column;justify-content:flex-start;padding:130px 46px 90px;overflow-y:auto;
  background:linear-gradient(270deg,rgba(0,16,21,.92) 55%,rgba(0,16,21,0) 100%);
  transform:translateX(30px);opacity:0;transition:all .6s cubic-bezier(.2,.7,.2,1);pointer-events:none}
#panel.show{transform:none;opacity:1;pointer-events:auto}
#panel .kick{font-size:11px;letter-spacing:.3em;color:var(--faint);text-transform:uppercase;margin-bottom:14px}
#panel .kick b{font-weight:500}
#panel h2{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(30px,4.6vw,52px);letter-spacing:.04em;line-height:1.05;color:var(--ink)}
#panel .jp{margin-top:8px;font-size:13px;letter-spacing:.1em;color:var(--dim)}
#panel p{margin-top:22px;font-size:13.5px;line-height:1.9;color:var(--dim);max-width:40ch}
#panel p b{color:var(--ink);font-weight:500}
.meta{margin-top:26px;border-top:1px solid rgba(147,161,161,.18);padding-top:18px;display:grid;gap:9px;font-size:12px}
.meta div{display:grid;grid-template-columns:86px 1fr;gap:14px}
.meta span{color:var(--faint);letter-spacing:.18em}
.meta b{color:var(--base2,#eee8d5);font-weight:400;word-break:break-word}
.actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.btn{font:700 12px/1 'JetBrains Mono',monospace;letter-spacing:.18em;text-decoration:none;cursor:pointer;
  border-radius:999px;padding:15px 28px;transition:all .22s;border:1px solid transparent}
.btn.primary{background:linear-gradient(90deg,var(--cyan),#3fb6a5);color:#00141b;box-shadow:0 4px 30px rgba(42,161,152,.3)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 8px 40px rgba(42,161,152,.5)}
.btn.ghost{color:var(--dim);border-color:rgba(147,161,161,.3)}
.btn.ghost:hover{color:var(--ink);border-color:var(--ink)}
.dots{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;display:flex;gap:9px}
.dots span{width:6px;height:6px;border-radius:50%;background:rgba(147,161,161,.35);cursor:pointer;transition:all .3s}
.dots span.on{background:var(--cyan);box-shadow:0 0 12px var(--cyan);transform:scale(1.3)}
@media (max-width:760px){
  #panel{width:100vw;background:linear-gradient(0deg,rgba(0,16,21,.94) 60%,rgba(0,16,21,0) 100%);
    top:auto;height:56%;padding:24px 26px 96px;justify-content:flex-start}
  #panel h2{font-size:30px}
  .navarrow{flex-direction:row;left:50%;right:auto;transform:translateX(-50%)}
  .dots{display:none}
  .hud-art{display:none}
}
@media (prefers-reduced-motion:reduce){
  .coin,.coin::before,#gate .caret{animation:none}
}
</style>
</head>
<body>

<!-- ======== GATE ======== -->
<div id="gate">
  <div class="mark">EPINOIA<span style="color:var(--cyan)">·</span>HORIZON</div>
  <div class="sub">THE ARCANE TERMINAL</div>
  <div class="rule"></div>
  <button class="coin" id="coin">⟡ SUMMON</button>
  <div class="hint">enter the sanctum<span class="caret"></span></div>
  <div class="foot">MERLIN AGENT — AN OPEN-SOURCE AI HARNESS · SOUND OFF BY DEFAULT</div>
</div>

<!-- ======== WORLD ======== -->
<canvas id="stage"></canvas>

<header class="topbar">
  <a class="brand" href="#">EPINOIA<i>·</i>HORIZON</a>
  <div class="toggles">
    <button class="tg off" id="tgSound">SOUND <b>OFF</b></button>
    <button class="tg" id="tgMotion">MOTION <b>ON</b></button>
    <a class="tg" href="/docs/" style="text-decoration:none">DOCS <b>↗</b></a>
  </div>
</header>

<div class="hud-art" id="hudart"><b>01</b> / 06 — THE HARNESS</div>
<div class="navarrow">
  <button id="prev" aria-label="Previous artifact">↑</button>
  <button id="next" aria-label="Next artifact">↓</button>
</div>
<div class="dots" id="dots"></div>

<!-- ======== PANELS (filled by JS) ======== -->
<aside id="panel"></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ================= DATA ================= */
const ARTIFACTS = [
  { id:"harness", name:"THE HARNESS", kick:"EXHIBIT 01 — CORE", jp:"自己進化する魔法使い",
    color:0x2aa198, accent:"#2aa198",
    desc:"<b>Merlin Agent</b> is an open-source AI harness that lives in your terminal. It remembers across sessions, writes its own skills, and grows sharper with every task it survives.",
    meta:[["ENGINE","Three.js r128 · vanilla"],["RUNS","Linux · macOS · WSL · Windows"],["LICENSE","Open source"]],
    actions:[["read the docs","/docs/","ghost"],["github","https://github.com/epinoiahorizon/Merlin-Agent","ghost"]] },
  { id:"install", name:"ONE COMMAND", kick:"EXHIBIT 02 — INSTALL", jp:"一つのコマンドで召喚",
    color:0x859900, accent:"#859900",
    desc:"No clones. No dependency rituals. The installer provisions Python, dependencies and skills — then hands you the keys.",
    meta:[["LINUX/WSL","curl -fsSL epinoiahorizon.com/install.sh | bash"],["WINDOWS","irm epinoiahorizon.com/install.ps1 | iex"],["AFTER","merlin setup → API key"]],
    actions:[["copy linux cmd","COPY_LINUX","primary"],["install guide","/docs/","ghost"]] },
  { id:"skills", name:"THE GRIMOIRE", kick:"EXHIBIT 03 — SKILLS", jp:"自ら書き加わる呪文書",
    color:0xd33682, accent:"#d33682",
    desc:"Every fix Merlin survives becomes an <b>imperative skill</b> — permanent, shareable, inherited by the next session. A spellbook that writes itself.",
    meta:[["BUNDLED","100+ skills, growing"],["FORMAT","SKILL.md — plain markdown"],["SYNC","skills hub · profiles"]],
    actions:[["browse skills","/docs/","ghost"]] },
  { id:"tools", name:"THE ORBIT", kick:"EXHIBIT 04 — TOOLS", jp:"二十四の工具が軌道を描く",
    color:0x6c71c4, accent:"#6c71c4",
    desc:"<b>24 tools</b> in orbit: browser, terminal, code execution, memory, computer use, messaging. Each one a spell under a single word.",
    meta:[["COUNT","24 tools · +12 toolsets"],["BROWSER","real Chrome via CDP"],["TERMINAL","persistent shell sessions"]],
    actions:[["tool reference","/docs/","ghost"]] },
  { id:"studio", name:"THE PORTAL", kick:"EXHIBIT 05 — STUDIO", jp:"六十秒で空に浮かぶ三次元",
    color:0xb58900, accent:"#b58900",
    desc:"Epinoia Horizon is also a <b>3D art studio</b> — gaussian splatting, WebGL worlds, real-time scenes like the one you are standing in. Commission the impossible.",
    meta:[["CRAFT","gaussian splats · shaders"],["TARGET","60fps in-browser"],["THIS SCENE","procedural · zero assets"]],
    actions:[["see the work","/main-site/","ghost"]] },
  { id:"summon", name:"BEGIN", kick:"EXHIBIT 06 — YOUR MOVE", jp:"さあ、名前を呼べ",
    color:0xeee8d5, accent:"#eee8d5",
    desc:"The sanctum is yours to keep. Install Merlin, speak, and watch the work carry itself.",
    meta:[["STEP 1","install (one command)"],["STEP 2","merlin setup"],["STEP 3","cast"]],
    actions:[["get merlin","#install","primary"],["full docs","/docs/","ghost"]] },
];

/* ================= STATE ================= */
let cur = 0, busy = false, motionOn = true, soundOn = false;
let renderer, scene, camera, raycaster, clock;
let groups = [], artifactAnchors = [], dustGeo, hum = null;
const camTarget = new THREE.Vector3(), lookTarget = new THREE.Vector3(), lookCur = new THREE.Vector3();

/* ================= AUDIO (procedural, no assets) ================= */
function ensureHum(){
  if (hum) return;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const ctx = new AC();
  const gain = ctx.createGain(); gain.gain.value = 0; gain.connect(ctx.destination);
  const osc1 = ctx.createOscillator(); osc1.type = "sine"; osc1.frequency.value = 54;
  const osc2 = ctx.createOscillator(); osc2.type = "sine"; osc2.frequency.value = 81.5;
  const g2 = ctx.createGain(); g2.gain.value = .35; osc2.connect(g2); g2.connect(gain); osc1.connect(gain);
  osc1.start(); osc2.start();
  hum = { ctx, gain };
}
function setHum(on){ if (!hum) return; hum.gain.gain.linearRampToValueAtTime(on ? .05 : 0, hum.ctx.currentTime + .6); }
function blip(freq){
  if (!soundOn || !hum) return;
  const o = hum.ctx.createOscillator(), g = hum.ctx.createGain();
  o.type = "triangle"; o.frequency.value = freq;
  g.gain.setValueAtTime(.08, hum.ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, hum.ctx.currentTime + .35);
  o.connect(g); g.connect(hum.ctx.destination);
  o.start(); o.stop(hum.ctx.currentTime + .4);
}

/* ================= WORLD ================= */
function buildWorld(){
  const canvas = document.getElementById("stage");
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x00141b);
  scene.fog = new THREE.FogExp2(0x00141b, 0.028);

  camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, .1, 200);
  camera.position.set(0, 2.2, 10);

  raycaster = new THREE.Raycaster();
  clock = new THREE.Clock();

  // lights
  scene.add(new THREE.AmbientLight(0x1a3a44, 1.1));
  const key = new THREE.DirectionalLight(0x93a1a1, .25); key.position.set(4, 10, 6); scene.add(key);

  // floor — dark with soft sheen
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(60, 64),
    new THREE.MeshStandardMaterial({ color:0x021a22, roughness:.42, metalness:.75 })
  );
  floor.rotation.x = -Math.PI/2; scene.add(floor);

  // arcane circles on the floor
  for (const [r, op] of [[6.2,.16],[9.5,.1],[13.5,.06]]) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(r, r+.03, 128),
      new THREE.MeshBasicMaterial({ color:0x2aa198, transparent:true, opacity:op, side:THREE.DoubleSide }));
    ring.rotation.x = -Math.PI/2; ring.position.y = .012; scene.add(ring);
  }

  // dust
  const N = 900, p = new Float32Array(N*3);
  for (let i=0;i<N;i++){ p[i*3]=(Math.random()-.5)*46; p[i*3+1]=Math.random()*11; p[i*3+2]=(Math.random()-.5)*46; }
  dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute("position", new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(dustGeo, new THREE.PointsMaterial({ color:0x93a1a1, size:2.2, sizeAttenuation:false, transparent:true, opacity:.45 })));

  // artifacts in a circle
  const R = 8.4;
  ARTIFACTS.forEach((a, i) => {
    const ang = (i / ARTIFACTS.length) * Math.PI*2 + Math.PI/2;
    const x = Math.cos(ang)*R, z = Math.sin(ang)*R;
    const anchor = new THREE.Vector3(x, 1.7, z);
    artifactAnchors.push(anchor);
    const g = buildArtifact(a, i, anchor);
    g.position.copy(anchor);
    scene.add(g);
    groups.push(g);
    // pedestal light — sedikit ke arah pusat agar tidak menyilaukan kamera dari luar
    const lp = new THREE.Vector3(x*.82, 3.0, z*.82);
    const pl = new THREE.PointLight(a.color, .8, 10);
    pl.position.copy(lp); scene.add(pl);
    // pedestal ring
    const pr = new THREE.Mesh(new THREE.RingGeometry(1.5, 1.56, 64),
      new THREE.MeshBasicMaterial({ color:a.color, transparent:true, opacity:.5, side:THREE.DoubleSide }));
    pr.rotation.x = -Math.PI/2; pr.position.set(x, .02, z); scene.add(pr);
  });

  camTarget.copy(offsetFor(0));
  const out0 = new THREE.Vector3(artifactAnchors[0].x, 0, artifactAnchors[0].z).normalize();
  lookCur.copy(artifactAnchors[0]).addScaledVector(new THREE.Vector3(out0.z, 0, -out0.x), 1.5);
  loop();
}

function buildArtifact(a, i, anchor){
  const g = new THREE.Group();
  g.userData.idx = i;
  // wajah depan artefak mengarah KE LUAR ring (ke arah kamera yang mendekat), + sway halus di loop
  g.userData.baseAngle = Math.atan2(anchor.x, anchor.z);
  const emissive = new THREE.MeshStandardMaterial({ color:0x06232b, roughness:.3, metalness:.6,
    emissive:a.color, emissiveIntensity:.55 });

  if (a.id === "harness"){                       // monolith with glowing edge
    const mono = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.6, .5), emissive); g.add(mono);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(mono.geometry),
      new THREE.LineBasicMaterial({ color:a.color })); g.add(edges);
  } else if (a.id === "install"){                // terminal slab
    const slab = new THREE.Mesh(new THREE.BoxGeometry(2.3, 1.45, .22), emissive); g.add(slab);
    const screen = new THREE.Mesh(new THREE.PlaneGeometry(2.05, 1.2),
      new THREE.MeshBasicMaterial({ color:0x0a2f26 }));
    screen.position.z = .125; g.add(screen);
    for (let l=0;l<4;l++){
      const line = new THREE.Mesh(new THREE.PlaneGeometry(1.5-l*.28, .05),
        new THREE.MeshBasicMaterial({ color:0x859900 }));
      line.position.set(-.72, .42-l*.24, .13); g.add(line);
    }
  } else if (a.id === "skills"){                 // floating grimoire
    const book = new THREE.Mesh(new THREE.BoxGeometry(1.5, .3, 1.9), emissive); g.add(book);
    const rune = new THREE.Mesh(new THREE.TorusGeometry(.42, .05, 12, 40),
      new THREE.MeshBasicMaterial({ color:a.color })); rune.position.set(0,.22,0);
    rune.rotation.x = Math.PI/2; g.add(rune);
  } else if (a.id === "tools"){                  // nucleus + orbiting gems
    const core = new THREE.Mesh(new THREE.IcosahedronGeometry(.5, 0), emissive); g.add(core);
    for (let k=0;k<8;k++){
      const gem = new THREE.Mesh(new THREE.OctahedronGeometry(.11, 0),
        new THREE.MeshBasicMaterial({ color:a.color }));
      const t = k/8*Math.PI*2;
      gem.userData.orbit = { r:1.15, t, sp:.55 + (k%3)*.16, y:(k%2? .5:-.5) };
      g.add(gem);
    }
    g.userData.spinners = true;
  } else if (a.id === "studio"){                 // portal
    const torus = new THREE.Mesh(new THREE.TorusGeometry(1.05, .07, 14, 60),
      new THREE.MeshBasicMaterial({ color:a.color })); g.add(torus);
    const inner = new THREE.Mesh(new THREE.CircleGeometry(.95, 48),
      new THREE.MeshBasicMaterial({ color:0x072a33, transparent:true, opacity:.9,
        side:THREE.DoubleSide })); g.add(inner);
    const gem = new THREE.Mesh(new THREE.TetrahedronGeometry(.3, 0),
      new THREE.MeshStandardMaterial({ color:0x06232b, emissive:0x2aa198, emissiveIntensity:.9 }));
    gem.position.z = .25; g.add(gem); g.userData.spinners = true; g.userData.spinner = gem;
  } else {                                       // summon — beaming sigil
    const sigil = new THREE.Mesh(new THREE.IcosahedronGeometry(.8, 1), emissive); g.add(sigil);
    const halo = new THREE.Mesh(new THREE.TorusGeometry(1.2, .025, 10, 60),
      new THREE.MeshBasicMaterial({ color:0xeee8d5, transparent:true, opacity:.7 }));
    halo.rotation.x = Math.PI/2.4; g.add(halo); g.userData.spinners = true; g.userData.spinner = sigil;
  }
  return g;
}

/* ================= CAMERA RAIL ================= */
function goto(i, instant){
  if (busy) return;
  cur = (i + ARTIFACTS.length) % ARTIFACTS.length;
  busy = true;
  const off = offsetFor(cur);
  camTarget.copy(off);
  // titik pandang digeser ke kanan artefak -> artefak jatuh di sepertiga KIRI frame (panel di kanan)
  const out = new THREE.Vector3(artifactAnchors[cur].x, 0, artifactAnchors[cur].z).normalize();
  const rightDir = new THREE.Vector3(out.z, 0, -out.x);
  lookTarget.copy(artifactAnchors[cur]).addScaledVector(rightDir, 1.5);
  showPanel(cur);
  blip(520 + cur*40);
  setTimeout(() => busy = false, instant ? 0 : 750);
}
function offsetFor(i){
  const a = artifactAnchors[i];
  const out = new THREE.Vector3(a.x, 0, a.z).normalize();   // arah keluar ring
  return new THREE.Vector3(a.x + out.x*6.2, 2.6, a.z + out.z*6.2);  // kamera DI LUAR, agak tinggi
}

/* ================= PANEL ================= */
const panel = document.getElementById("panel");
function showPanel(i){
  const a = ARTIFACTS[i];
  const acts = a.actions.map(([label, href, kind]) =>
    href === "COPY_LINUX"
      ? `<button class="btn ${kind}" data-copy="1">${label}</button>`
      : `<a class="btn ${kind}" href="${href}">${label}</a>`).join("");
  panel.innerHTML = `
    <div class="kick">${a.kick} · <b style="color:${a.accent}">◆</b></div>
    <h2 style="text-shadow:0 0 40px ${a.accent}44">${a.name}</h2>
    <div class="jp">${a.jp}</div>
    <p>${a.desc}</p>
    <div class="meta">${a.meta.map(([k,v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>
    <div class="actions">${acts}</div>`;
  panel.classList.remove("show");
  requestAnimationFrame(() => requestAnimationFrame(() => panel.classList.add("show")));
  panel.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText("curl -fsSL https://epinoiahorizon.com/install.sh | bash"); } catch(e){}
    b.textContent = "copied ✓"; setTimeout(() => b.textContent = "copy linux cmd", 1500);
  }));
  document.getElementById("hudart").innerHTML = `<b>${String(i+1).padStart(2,"0")}</b> / ${String(ARTIFACTS.length).padStart(2,"0")} — ${a.name}`;
  document.querySelectorAll("#dots span").forEach((d,k) => d.classList.toggle("on", k===i));
}

/* ================= LOOP ================= */
function loop(){
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta(), .05);

  camera.position.lerp(camTarget, .045);
  lookCur.lerp(lookTarget, .06);
  camera.lookAt(lookCur);

  if (motionOn){
    groups.forEach((g, i) => {
      g.position.y = artifactAnchors[i].y + Math.sin(t*.9 + i*1.7)*.16;
      g.rotation.y = (g.userData.baseAngle || 0) + Math.sin(t*.6 + i*1.3)*.22;
      if (g.userData.spinners && g.userData.spinner) g.userData.spinner.rotation.x = t*1.3;
      if (g.userData.spinners) g.children.forEach(ch => {
        if (ch.userData.orbit){
          const o = ch.userData.orbit; o.t += o.sp*dt;
          ch.position.set(Math.cos(o.t)*o.r, o.y + Math.sin(o.t*1.6)*.14, Math.sin(o.t)*o.r);
        }
      });
    });
    const dp = dustGeo.attributes.position.array;
    for (let i=1;i<dp.length;i+=3){ dp[i] += .0035; if (dp[i] > 11) dp[i] = 0; }
    dustGeo.attributes.position.needsUpdate = true;
  }
  renderer.render(scene, camera);
}

/* ================= INPUT ================= */
let wheelLock = 0;
addEventListener("wheel", e => {
  if (gateOpen || busy) return;
  const now = performance.now();
  if (now - wheelLock < 900 || Math.abs(e.deltaY) < 12) return;
  wheelLock = now;
  goto(cur + (e.deltaY > 0 ? 1 : -1));
}, { passive:true });
addEventListener("keydown", e => {
  if (gateOpen) return;
  if (e.key === "ArrowDown" || e.key === "ArrowRight") goto(cur+1);
  if (e.key === "ArrowUp" || e.key === "ArrowLeft") goto(cur-1);
});
document.getElementById("prev").addEventListener("click", () => goto(cur-1));
document.getElementById("next").addEventListener("click", () => goto(cur+1));

// click / drag-orbit on canvas
let px = 0, py = 0, dragged = false;
const stage = document.getElementById("stage");
stage.addEventListener("pointerdown", e => { px = e.clientX; py = e.clientY; dragged = false; });
stage.addEventListener("pointermove", e => {
  if (e.buttons !== 1) return;
  if (Math.abs(e.clientX-px) + Math.abs(e.clientY-py) > 8) dragged = true;
});
stage.addEventListener("pointerup", e => {
  if (dragged || gateOpen) return;
  const m = new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(m, camera);
  const hit = raycaster.intersectObjects(groups, true);
  if (hit.length) goto(hit[0].object.userData.idx ?? groups.indexOf(hit[0].object.parent) ?? cur);
});

// dots
const dotsEl = document.getElementById("dots");
ARTIFACTS.forEach((a, i) => {
  const s = document.createElement("span");
  s.addEventListener("click", () => goto(i));
  dotsEl.appendChild(s);
});

// toggles
const tgSound = document.getElementById("tgSound"), tgMotion = document.getElementById("tgMotion");
tgSound.addEventListener("click", () => {
  soundOn = !soundOn; ensureHum();
  if (hum && hum.ctx.state === "suspended") hum.ctx.resume();
  setHum(soundOn);
  tgSound.classList.toggle("off", !soundOn);
  tgSound.innerHTML = `SOUND <b>${soundOn?"ON":"OFF"}</b>`;
});
tgMotion.addEventListener("click", () => {
  motionOn = !motionOn;
  tgMotion.classList.toggle("off", !motionOn);
  tgMotion.innerHTML = `MOTION <b>${motionOn?"ON":"OFF"}</b>`;
});

/* ================= GATE ================= */
let gateOpen = true, worldBuilt = false;
function summon(){
  if (!worldBuilt){ buildWorld(); worldBuilt = true; showPanel(0); }
  document.getElementById("gate").classList.add("away");
  gateOpen = false;
  blip(660);
}
document.getElementById("coin").addEventListener("click", summon);
addEventListener("keydown", e => { if (gateOpen && e.key !== "F5" && e.key !== "F12") summon(); }, { once:false });

addEventListener("resize", () => {
  if (!worldBuilt) return;
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
